<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Drive Streaming Fix</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #fff;
  text-align: center;
}

iframe {
  width: 80%;
  height: 500px;
  margin-top: 20px;
  border-radius: 10px;
  border: none;
}
</style>
</head>

<body>

<h2>🎬 Drive Streaming Fix</h2>

<button onclick="loadVideo(0)">Video 1</button>
<button onclick="loadVideo(1)">Video 2</button>

<br>

<iframe id="player" allow="autoplay"></iframe>

<script>
const videos = [
  "https://drive.google.com/file/d/1uVs8KlgFZ432KE9sGhCWmIjCmDmMk_0C/preview",
  "https://drive.google.com/file/d/1FusEuxGuzFqMm3pcR2d0-wq8NYXgiyy8/preview"
];

function loadVideo(i) {
  document.getElementById("player").src = videos[i];
}

// auto load video đầu
loadVideo(0);
</script>

</body>
</html>
